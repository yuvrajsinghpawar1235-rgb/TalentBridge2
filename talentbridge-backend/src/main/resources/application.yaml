server:
  port: 8080

spring:
  application:
    name: talentbridge-backend
  datasource:
    url: jdbc:mysql://localhost:3306/talentbridge_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true